<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>A Diwali note from Vikas</title>
<meta name="description" content="Shubh Deepavali 🪔">

<meta property="og:title" content="A Diwali note from Vikas">
<meta property="og:description" content="Shubh Deepavali 🪔">
<meta property="og:image" content="https://onpointnexus.com/diwali/og.png">
<meta property="og:type" content="website">

<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400&family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Hanken Grotesk',system-ui,sans-serif;
  color:#09384A;
  background:#FBF7EF;
  min-height:100svh;
  display:flex; flex-direction:column; align-items:center;
  padding:48px 24px;
  -webkit-font-smoothing:antialiased;
}
.mark{height:52px; width:auto; margin-bottom:28px}
.diya{margin-bottom:22px}
@keyframes flicker{0%,100%{transform:scale(1,1)}30%{transform:scale(.94,1.06)}60%{transform:scale(1.04,.96)}80%{transform:scale(.97,1.03)}}
.flame{transform-box:fill-box; transform-origin:50% 90%; animation:flicker 2.4s ease-in-out infinite}
.eyebrow{font-size:13px; letter-spacing:.06em; color:#8A5D14; margin-bottom:12px}
h1{
  font-family:'Fraunces',Georgia,serif; font-weight:400;
  font-size:30px; line-height:1.2; color:#09384A;
  text-align:center; max-width:30ch;
  margin:0 0 18px;
}
p{
  font-size:16px; line-height:1.55; color:#1F3F4B;
  text-align:center; max-width:34ch;
}
.spacer{flex:1}
footer{
  font-size:12px; color:#5C7680;
  margin-top:48px;
}
@media (prefers-reduced-motion:reduce){ .flame{animation:none} }
</style>
</head>
<body>
  <img class="mark" src="/diwali/onpoint-logo-ink.png" alt="OnPoint Nexus">

  <svg class="diya" width="72" height="72" viewBox="0 0 96 96" aria-hidden="true">
    <path class="flame" d="M48 14c7 9 9 16 0 26c-9-10-7-17 0-26z" fill="#F0CD8F" stroke="#E2B66A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M16 50h64c0 15-14 26-32 26S16 65 16 50z" fill="none" stroke="#8A5D14" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M36 86h24" stroke="#8A5D14" stroke-width="2.4" stroke-linecap="round"/>
  </svg>

  <div class="eyebrow">Shubh Deepavali</div>
  <h1>This was a Diwali 2026 note from Vikas.</h1>
  <p>Shubh Deepavali — and thank you.</p>

  <div class="spacer"></div>
  <footer>OnPoint Nexus</footer>
</body>
</html>
