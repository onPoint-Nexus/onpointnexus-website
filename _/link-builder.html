<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Builder — Internal</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { darkMode:'class', theme:{ extend:{ colors:{ primary:'#1ABADC','primary-dim':'#0E8FA8', surface:'#0c1324','surface-card':'#141c2e','surface-low':'#080e1c','on-surface':'#E8EDF5','on-surface-dim':'#8A9BB5','on-surface-muted':'#5A7494' } }}}
  </script>
  <style>
    body { background:#0c1324; color:#E8EDF5; font-family:'Plus Jakarta Sans',sans-serif; }
    .fld { display:block; font-family:'Roboto Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:#8A9BB5; margin-bottom:8px; font-weight:600; }
    .inp { width:100%; padding:12px 16px; background:#0f1729; color:#E8EDF5; border:1px solid rgba(255,255,255,0.08); border-radius:10px; font-size:14px; font-family:inherit; }
    .inp:focus { outline:none; border-color:#1ABADC; box-shadow:0 0 0 3px rgba(26,186,220,0.15); }
    .btn { padding:12px 22px; background:#1ABADC; color:#0c1324; border:none; border-radius:999px; font-family:inherit; font-weight:700; font-size:14px; cursor:pointer; }
    .btn:hover { background:#0E8FA8; }
    .btn-sec { padding:10px 18px; background:transparent; color:#8A9BB5; border:1px solid rgba(255,255,255,0.15); border-radius:999px; font-family:inherit; font-weight:600; font-size:13px; cursor:pointer; }
    .btn-sec:hover { color:#E8EDF5; border-color:rgba(255,255,255,0.3); }
    .out { padding:16px 18px; background:#0f1729; border:1px solid rgba(26,186,220,0.28); border-radius:10px; word-break:break-all; font-family:'Roboto Mono',monospace; font-size:12.5px; line-height:1.5; color:#8de4f0; }
    .radio-set { display:flex; flex-wrap:wrap; gap:8px; }
    .radio-set label { padding:8px 14px; border:1px solid rgba(255,255,255,0.08); background:#0f1729; border-radius:8px; cursor:pointer; font-size:13px; user-select:none; }
    .radio-set label:hover { border-color:rgba(26,186,220,0.35); }
    .radio-set input { display:none; }
    .radio-set input:checked + span { color:#1ABADC; }
    .radio-set label:has(input:checked) { background:rgba(26,186,220,0.08); border-color:#1ABADC; }
  </style>
</head>
<body class="antialiased">

<!-- Password gate -->
<div id="gate" class="min-h-screen flex items-center justify-center px-6">
  <div class="max-w-sm w-full">
    <h1 class="text-2xl font-bold mb-6">Link Builder <span class="text-on-surface-muted text-sm font-mono ml-2">internal</span></h1>
    <label class="fld">Password</label>
    <input type="password" id="pwInput" class="inp mb-4" autofocus>
    <button class="btn w-full" onclick="unlock()">Unlock</button>
    <p class="text-xs text-on-surface-muted mt-4" id="pwError" style="display:none; color:#f87171;">Wrong password.</p>
  </div>
</div>

<!-- Builder -->
<main id="app" class="max-w-3xl mx-auto px-6 py-16" style="display:none;">
  <header class="mb-10">
    <h1 class="text-3xl font-bold mb-2">Personalised link builder</h1>
    <p class="text-on-surface-dim text-sm">Generate a `/hello` URL to paste in DM replies to social comments.</p>
  </header>

  <form id="lbForm" class="flex flex-col gap-6">
    <div>
      <label class="fld" for="lbName">Name (first name is enough)</label>
      <input class="inp" type="text" id="lbName" placeholder="Vikas" required>
    </div>

    <div>
      <label class="fld" for="lbMsg">Their comment / message</label>
      <textarea class="inp" id="lbMsg" rows="3" placeholder="We're a growing clinic and need AI to reduce admin load." required style="resize:vertical;font-family:inherit;"></textarea>
    </div>

    <div>
      <label class="fld">Post</label>
      <div class="radio-set">
        <label><input type="radio" name="post" value="chatgpt-prompt" checked><span>ChatGPT prompt</span></label>
        <label><input type="radio" name="post" value="ai-scaling"><span>AI scaling</span></label>
        <label><input type="radio" name="post" value="scaleos"><span>ScaleOS</span></label>
      </div>
    </div>

    <div>
      <label class="fld">Source platform</label>
      <div class="radio-set">
        <label><input type="radio" name="src" value="ig" checked><span>Instagram</span></label>
        <label><input type="radio" name="src" value="fb"><span>Facebook</span></label>
        <label><input type="radio" name="src" value="li"><span>LinkedIn</span></label>
      </div>
    </div>

    <div class="flex gap-3 flex-wrap">
      <button type="submit" class="btn">Generate short link ✨</button>
      <button type="button" class="btn-sec" id="longBtn">Full URL (fallback)</button>
      <button type="button" class="btn-sec" id="clearBtn">Clear</button>
    </div>
  </form>

  <div id="output" class="mt-10" style="display:none;">
    <label class="fld" id="outLabel">Shareable link</label>
    <div class="out mb-3" id="urlOut"></div>
    <div class="flex gap-3 items-center flex-wrap">
      <button class="btn" id="copyBtn">Copy to clipboard</button>
      <a class="btn-sec" id="previewBtn" target="_blank" rel="noopener">Preview in new tab</a>
      <span class="text-xs text-on-surface-muted" id="copyMsg" style="display:none;">Copied ✓</span>
    </div>
    <p class="text-xs text-on-surface-muted mt-4" id="outMeta"></p>
  </div>
</main>

<script>
(function(){
  'use strict';

  // Soft gate — keeps casual visitors out. Not real security; anyone
  // who Views Source sees the string. That's acceptable for an internal
  // tool with no destructive endpoints (this page only generates URLs).
  // Rotate freely; there's nothing to lose if this leaks.
  const CORRECT_PW = 'opn-lb-2026';

  window.unlock = function() {
    const pw = document.getElementById('pwInput').value;
    if (pw === CORRECT_PW) {
      sessionStorage.setItem('lb-ok', '1');
      show();
    } else {
      document.getElementById('pwError').style.display = '';
    }
  };

  function show(){
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = '';
  }
  if (sessionStorage.getItem('lb-ok') === '1') show();

  document.getElementById('pwInput')?.addEventListener('keydown', e => {
    if (e.key === 'Enter') window.unlock();
  });

  // Build link
  const BASE = 'https://www.onpointnexus.com/hello';
  const SHORT_BASE = 'https://www.onpointnexus.com/l/';

  function readFields() {
    const n = document.getElementById('lbName').value.trim();
    const m = document.getElementById('lbMsg').value.trim();
    const post = document.querySelector('input[name="post"]:checked').value;
    const src = document.querySelector('input[name="src"]:checked').value;
    if (!n || !m) return null;
    return { n, m, p: post, src };
  }

  function longUrl(f) {
    return BASE + '?n=' + encodeURIComponent(f.n) + '&m=' + encodeURIComponent(f.m) + '&p=' + encodeURIComponent(f.p) + '&src=' + encodeURIComponent(f.src);
  }

  function showResult(url, isShort, meta) {
    document.getElementById('urlOut').textContent = url;
    document.getElementById('output').style.display = '';
    document.getElementById('previewBtn').setAttribute('href', url);
    document.getElementById('outLabel').textContent = isShort ? 'Short link (paste this in the DM)' : 'Full URL (long fallback)';
    document.getElementById('outMeta').textContent = meta || '';
  }

  // Primary: short link via API
  document.getElementById('lbForm').addEventListener('submit', async e => {
    e.preventDefault();
    const f = readFields();
    if (!f) return;
    const submitBtn = e.target.querySelector('button[type=submit]');
    submitBtn.disabled = true;
    const originalText = submitBtn.innerHTML;
    submitBtn.textContent = 'Generating…';

    try {
      const resp = await fetch('/api/shortlink', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...f, password: CORRECT_PW })
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        if (data.error === 'kv-not-configured') {
          alert('Vercel KV isn’t set up yet. Falling back to the long URL.\n\nTo enable short links: go to your Vercel project → Storage → Create KV database → Connect to project.');
        } else {
          alert('Short-link generation failed: ' + (data.error || resp.status) + '. Falling back to long URL.');
        }
        showResult(longUrl(f), false);
      } else {
        const meta = data.expiresInDays ? ('Auto-expires in ' + data.expiresInDays + ' days.') : '';
        showResult(data.url, true, meta);
      }
    } catch (err) {
      alert('Network error. Falling back to long URL.');
      showResult(longUrl(f), false);
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = originalText;
    }
  });

  // Fallback: long URL (no server call)
  document.getElementById('longBtn').addEventListener('click', () => {
    const f = readFields();
    if (!f) return;
    showResult(longUrl(f), false);
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    document.getElementById('lbForm').reset();
    document.getElementById('output').style.display = 'none';
  });

  document.getElementById('copyBtn').addEventListener('click', async () => {
    const txt = document.getElementById('urlOut').textContent;
    try {
      await navigator.clipboard.writeText(txt);
      const msg = document.getElementById('copyMsg');
      msg.style.display = '';
      setTimeout(() => msg.style.display = 'none', 1500);
    } catch (err) {
      alert('Copy failed. Please select the URL and copy manually.');
    }
  });
})();
</script>

</body>
</html>
